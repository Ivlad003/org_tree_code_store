<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # Dev parity: router.php maps /admin under `php -S`. Without this the URL a
        # human types works locally and 404s in production.
        RewriteEngine On
        RewriteRule ^admin/?$ admin.php [L]
    </Directory>

    # Defence in depth. script-src names the two CDNs the chart loads from; the
    # SRI hashes in index.php are the primary guard, this is the backstop. 'unsafe-inline'
    # is required: the ORG_DATA payload and several handlers are inline (removing it
    # means moving them to files, not just deleting the keyword).
    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://d3js.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        # Keeps the signed-in viewer's URL out of the Referer sent to LinkedIn.
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Nothing dot-prefixed belongs under the document root, but deny it if it appears.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
