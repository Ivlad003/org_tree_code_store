<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # Dev parity: router.php maps /admin under `php -S`. Without this the URL a
        # human types works locally and 404s in production.
        RewriteEngine On
        RewriteRule ^admin/?$ admin.php [L]
    </Directory>

    # Nothing dot-prefixed belongs under the document root, but deny it if it appears.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
